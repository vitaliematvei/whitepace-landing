  <path d="M28 40C28 31.1634 35.1634 24 44 24H704C712.837 24 720 31.1634 720 40V72H28V40Z" fill="#043873"/>
  
  <!-- Butoane Window Controls -->
  <circle cx="56" cy="48" r="6" fill="#FF5F56"/>
  <circle cx="74" cy="48" r="6" fill="#FFE492"/>
  <circle cx="92" cy="48" r="6" fill="#27C93F"/>

  <!-- Titlu / Search Header -->
  <rect x="124" y="38" width="180" height="20" rx="6" fill="#1B4F8A"/>
  <rect x="580" y="36" width="116" height="24" rx="12" fill="#4F9CF9"/>
  <circle cx="594" cy="48" r="6" fill="#FFFFFF"/>
  <rect x="606" y="45" width="60" height="6" rx="3" fill="#FFFFFF"/>

  <!-- Sidebar Stânga (Meniu de unelte & setări) -->
  <rect x="28" y="72" width="160" height="451" fill="#F8FAFC"/>
  
