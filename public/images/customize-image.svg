  <rect x="240" y="390" width="140" height="6" rx="3" fill="#4F9CF9"/>
  <circle cx="380" cy="393" r="8" fill="#4F9CF9"/>

  <!-- Toggle Switch ON -->
  <rect x="240" y="420" width="40" height="20" rx="10" fill="#4F9CF9"/>
  <circle cx="270" cy="430" r="7" fill="#FFFFFF"/>
  <rect x="290" y="426" width="90" height="8" rx="4" fill="#64748B"/>


  <!-- COLOANA 2: Extensii & Module Drag & Drop -->
  <rect x="452" y="152" width="250" height="340" rx="10" fill="#F1F5F9"/>
  <rect x="468" y="168" width="120" height="12" rx="6" fill="#043873"/>

  <!-- Card Extension 1 (Active Plugin) -->
  <rect x="464" y="192" width="226" height="80" rx="8" fill="#FFFFFF" stroke="#4F9CF9" stroke-width="1.5"/>
  <rect x="476" y="204" width="28" height="28" rx="6" fill="#E2EDFB"/>
  <rect x="484" y="212" width="12" height="12" rx="2" fill="#4F9CF9"/>
  <rect x="514" y="206" width="100" height="10" rx="4" fill="#043873"/>
  <rect x="514" y="222" width="80" height="8" rx="4" fill="#94A3B8"/>
  <!-- Toggle Active -->
  <rect x="638" y="208" width="38" height="20" rx="10" fill="#27C93F"/>
  <circle cx="666" cy="218" r="7" fill="#FFFFFF"/>

  <!-- Card Extension 2 -->
  <rect x="464" y="280" width="226" height="80" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="476" y="292" width="28" height="28" rx="6" fill="#FEF3C7"/>
  <rect x="484" y="300" width="12" height="12" rx="2" fill="#FFE492"/>
  <rect x="514" y="294" width="90" height="10" rx="4" fill="#1E293B"/>
  <rect x="514" y="310" width="70" height="8" rx="4" fill="#94A3B8"/>
  <!-- Toggle Inactive -->
  <rect x="638" y="296" width="38" height="20" rx="10" fill="#CBD5E1"/>
  <circle cx="648" cy="306" r="7" fill="#FFFFFF"/>


  <!-- WIDGET FLOTANT (Identic ca poziție și umbră cu cel din referință) -->
  <g filter="url(#shadow-customise)">
    <rect x="460" y="380" width="210" height="90" rx="12" fill="#043873"/>
    <text x="478" y="406" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#FFE492">Flexibility &amp; Plugins</text>
    <text x="478" y="434" font-family="system-ui, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">100%</text>
    <text x="545" y="432" font-family="system-ui, sans-serif" font-weight="400" font-size="11" fill="#93C5FD">customizable UI</text>
    <path d="M600 445 C 620 430, 630 435, 650 410" stroke="#FFE492" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <defs>
    <filter id="shadow-customise" x="440" y="365" width="250" height="130" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#043873" flood-opacity="0.25"/>
    </filter>
  </defs>
</svg>
