  <path d="M251 240L255 244L263 236" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Card 2: Control Slider & Layout Options -->
  <rect x="228" y="304" width="200" height="172" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="240" y="318" width="110" height="8" rx="4" fill="#1E293B"/>
  <rect x="240" y="332" width="70" height="8" rx="4" fill="#94A3B8"/>
  
  <!-- Sliders de ajustare -->
  <rect x="240" y="360" width="176" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="240" y="360" width="110" height="6" rx="3" fill="#4F9CF9"/>
  <circle cx="350" cy="363" r="8" fill="#4F9CF9"/>

