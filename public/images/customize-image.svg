  <rect x="56" y="152" width="14" height="14" rx="3" fill="#94A3B8"/>
  <rect x="76" y="154" width="84" height="10" rx="5" fill="#64748B"/>
  
  <rect x="56" y="188" width="14" height="14" rx="3" fill="#94A3B8"/>
  <rect x="76" y="190" width="70" height="10" rx="5" fill="#64748B"/>
  
  <rect x="56" y="224" width="14" height="14" rx="3" fill="#94A3B8"/>
  <rect x="76" y="226" width="90" height="10" rx="5" fill="#64748B"/>

  <!-- ZONĂ DE CONȚINUT PRINCIPAL: CUSTOMIZATION WORKSPACE -->
  
  <!-- Titlu Secțiune -->
  <text x="216" y="112" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#043873">Customise Workspace &amp; Extensions</text>
  <rect x="216" y="124" width="180" height="8" rx="4" fill="#CBD5E1"/>

  <!-- Swatches Culori Teme (Dreapta sus) -->
  <circle cx="616" cy="110" r="14" fill="#FFE492"/>
  <circle cx="640" cy="110" r="14" fill="#4F9CF9"/>
  <circle cx="664" cy="110" r="14" fill="#27C93F"/>
  <circle cx="688" cy="110" r="14" fill="#043873"/>

  <!-- COLOANA 1: Setări Temă & Aspect -->
  <rect x="216" y="152" width="224" height="340" rx="10" fill="#F1F5F9"/>
  <rect x="232" y="168" width="100" height="12" rx="6" fill="#043873"/>

  <!-- Card 1: Selector Paletă de Culori -->
  <rect x="228" y="192" width="200" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="240" y="204" width="90" height="8" rx="4" fill="#64748B"/>
  <!-- Color Chips -->
  <rect x="240" y="224" width="32" height="32" rx="6" fill="#4F9CF9"/>
  <rect x="280" y="224" width="32" height="32" rx="6" fill="#FFE492"/>
