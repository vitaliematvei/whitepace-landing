<svg width="748" height="547" viewBox="0 0 748 547" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundal Canvas principal (Raport & dimensiuni identice 748x547) -->
  <rect width="748" height="547" rx="20" fill="#F4F8FF"/>
  
